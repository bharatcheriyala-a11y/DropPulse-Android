name: Build DropPulse Pro APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Native Android APK
        run: |
          npm install
          mkdir -p www
          cp index.html www/index.html
          npx cap init "DropPulse PRO" "com.droppulse.proshare" --web-dir www
          npx cap add android

          # Camera & Storage Permissions for all Android devices
          sed -i 's/<application/<uses-permission android:name="android.permission.CAMERA" \/>\n    <uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" \/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" \/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" \/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" \/>\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" \/>\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" \/>\n    <application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

          cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload Official APK
        uses: actions/upload-artifact@v4
        with:
          name: DropPulse-PRO-Official
          path: android/app/build/outputs/apk/debug/app-debug.apk
