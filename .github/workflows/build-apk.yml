name: Build DropPulse Pro Offline APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Native Offline P2P Android APK
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 sharp
          mkdir -p www
          cp index.html www/index.html

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.droppulse.proshare",
            "appName": "DropPulse PRO",
            "webDir": "www",
            "server": {
              "androidScheme": "http",
              "cleartext": true
            },
            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 0
              }
            }
          }
          EOF

          yes | npx cap add android

          # 1. Generate 512x512 Custom DropPulse PRO Launcher Icon
          cat << 'EOF' > make-icon.js
          const sharp = require('sharp');
          const fs = require('fs');
          const svg = `<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#0B132B"/>
                <stop offset="100%" stop-color="#1E1B4B"/>
              </linearGradient>
              <linearGradient id="ar" x1="180" y1="120" x2="400" y2="390" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#38BDF8"/>
                <stop offset="100%" stop-color="#A855F7"/>
              </linearGradient>
            </defs>
            <rect width="512" height="512" fill="url(#bg)"/>
            <circle cx="165" cy="256" r="52" fill="#38BDF8"/>
            <path d="M210 228L315 142L298 115L402 138L368 232L350 205L232 258Z" fill="url(#ar)"/>
            <path d="M210 284L315 370L298 397L402 374L368 280L350 307L232 254Z" fill="url(#ar)"/>
            <path d="M245 256H315L334 210L360 302L384 228L404 256H458" stroke="#7DD3FC" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </svg>`;

          (async () => {
            const sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192
            };
            for (const [folder, size] of Object.entries(sizes)) {
              const dir = `android/app/src/main/res/${folder}`;
              if (fs.existsSync(dir)) {
                await sharp(Buffer.from(svg)).resize(size, size).png().toFile(`${dir}/ic_launcher.png`);
                await sharp(Buffer.from(svg)).resize(size, size).png().toFile(`${dir}/ic_launcher_round.png`);
                await sharp(Buffer.from(svg)).resize(size, size).png().toFile(`${dir}/ic_launcher_foreground.png`);
              }
            }
          })();
          EOF
          node make-icon.js

          # 2. Add NanoHTTPD (Android Local Server) & ZXing Core (Offline QR)
          sed -i 's/dependencies {/dependencies {\n    implementation "org.nanohttpd:nanohttpd:2.3.1"\n    implementation "com.google.zxing:core:3.5.3"/' android/app/build.gradle

          # 3. Create Android-Native High-Speed Local HTTP Server (LocalDropServer.java)
          PKG_DIR=$(dirname $(find android/app/src/main/java -name "MainActivity.java"))
          cat << 'EOF' > "$PKG_DIR/LocalDropServer.java"
          package com.droppulse.proshare;

          import android.content.Context;
          import android.os.Environment;
          import fi.iki.elonen.NanoHTTPD;
          import java.io.*;
          import java.net.*;
          import java.util.*;

          public class LocalDropServer extends NanoHTTPD {
              private final Context context;
              private final File shareDir;
              public static final int PORT = 8080;

              public LocalDropServer(Context ctx) {
                  super("0.0.0.0", PORT);
                  this.context = ctx;
                  File downloads = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                  this.shareDir = new File(downloads, "DropPulse");
                  if (!this.shareDir.exists()) this.shareDir.mkdirs();
              }

              @Override
              public Response serve(IHTTPSession session) {
                  String uri = session.getUri();
                  Method method = session.getMethod();

                  if (Method.OPTIONS.equals(method)) {
                      return withCors(newFixedLengthResponse(Response.Status.NO_CONTENT, "text/plain", ""));
                  }

                  try {
                      // 1. Upload endpoint (streams directly to Phone Downloads/DropPulse)
                      if ("/upload".equals(uri) && Method.POST.equals(method)) {
                          Map<String, String> params = session.getParms();
                          String rawName = params.get("name");
                          if (rawName == null || rawName.isEmpty()) rawName = "file_" + System.currentTimeMillis();
                          String safeName = rawName.replaceAll("[^a-zA-Z0-9._\\- ]", "_");
                          File outFile = new File(shareDir, safeName);

                          String contentLengthHeader = session.getHeaders().get("content-length");
                          long contentLength = contentLengthHeader != null ? Long.parseLong(contentLengthHeader) : -1;
                          InputStream is = session.getInputStream();

                          try (FileOutputStream fos = new FileOutputStream(outFile)) {
                              byte[] buf = new byte[65536];
                              long remaining = contentLength;
                              while (remaining != 0) {
                                  int toRead = remaining > 0 ? (int) Math.min(buf.length, remaining) : buf.length;
                                  int read = is.read(buf, 0, toRead);
                                  if (read <= 0) break;
                                  fos.write(buf, 0, read);
                                  if (remaining > 0) remaining -= read;
                              }
                          }
                          return withCors(newFixedLengthResponse(Response.Status.OK, "application/json", "{\"ok\":true}"));
                      }

                      // 2. List shared files
                      if ("/list".equals(uri)) {
                          File[] files = shareDir.listFiles();
                          StringBuilder json = new StringBuilder("[");
                          if (files != null) {
                              Arrays.sort(files, Comparator.comparingLong(File::lastModified));
                              boolean first = true;
                              for (File f : files) {
                                  if (!f.isFile()) continue;
                                  if (!first) json.append(",");
                                  first = false;
                                  json.append("{\"name\":\"").append(f.getName().replace("\"", "\\\""))
                                      .append("\",\"size\":").append(f.length()).append("}");
                              }
                          }
                          json.append("]");
                          return withCors(newFixedLengthResponse(Response.Status.OK, "application/json", json.toString()));
                      }

                      // 3. Download / Stream file
                      if (uri.startsWith("/files/")) {
                          String name = URLDecoder.decode(uri.substring("/files/".length()), "UTF-8");
                          File target = new File(shareDir, name);
                          if (!target.exists()) {
                              return withCors(newFixedLengthResponse(Response.Status.NOT_FOUND, "text/plain", "Not found"));
                          }
                          FileInputStream fis = new FileInputStream(target);
                          Response res = newFixedLengthResponse(Response.Status.OK, guessMime(target.getName()), fis, target.length());
                          Map<String, String> params = session.getParms();
                          if ("1".equals(params.get("download"))) {
                              res.addHeader("Content-Disposition", "attachment; filename=\"" + target.getName() + "\"");
                          }
                          return withCors(res);
                      }

                      // 4. Serve Web App UI to Laptop / 2nd Phone
                      InputStream htmlStream = context.getAssets().open("public/index.html");
                      return withCors(newChunkedResponse(Response.Status.OK, "text/html; charset=UTF-8", htmlStream));

                  } catch (Exception e) {
                      return withCors(newFixedLengthResponse(Response.Status.INTERNAL_ERROR, "text/plain", e.getMessage()));
                  }
              }

              private Response withCors(Response res) {
                  res.addHeader("Access-Control-Allow-Origin", "*");
                  res.addHeader("Access-Control-Allow-Methods", "GET, POST, OPTIONS");
                  res.addHeader("Access-Control-Allow-Headers", "*");
                  return res;
              }

              public String getLocalIpUrl() {
                  try {
                      Enumeration<NetworkInterface> interfaces = NetworkInterface.getNetworkInterfaces();
                      String fallback = null;
                      while (interfaces.hasMoreElements()) {
                          NetworkInterface ni = interfaces.nextElement();
                          if (!ni.isUp() || ni.isLoopback()) continue;
                          Enumeration<InetAddress> addrs = ni.getInetAddresses();
                          while (addrs.hasMoreElements()) {
                              InetAddress addr = addrs.nextElement();
                              if (addr instanceof Inet4Address && !addr.isLoopbackAddress()) {
                                  String ip = addr.getHostAddress();
                                  if (ip.startsWith("192.168.")) return "http://" + ip + ":" + PORT;
                                  fallback = "http://" + ip + ":" + PORT;
                              }
                          }
                      }
                      if (fallback != null) return fallback;
                  } catch (Exception ignored) {}
                  return "http://192.168.43.1:" + PORT;
              }

              private String guessMime(String name) {
                  String lower = name.toLowerCase();
                  if (lower.endsWith(".jpg") || lower.endsWith(".jpeg")) return "image/jpeg";
                  if (lower.endsWith(".png")) return "image/png";
                  if (lower.endsWith(".webp")) return "image/webp";
                  if (lower.endsWith(".mp4")) return "video/mp4";
                  if (lower.endsWith(".apk")) return "application/vnd.android.package-archive";
                  return "application/octet-stream";
              }
          }
          EOF

          # 4. Update MainActivity.java
          cat << 'EOF' > "$PKG_DIR/MainActivity.java"
          package com.droppulse.proshare;

          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;
          import com.google.zxing.BarcodeFormat;
          import com.google.zxing.common.BitMatrix;
          import com.google.zxing.qrcode.QRCodeWriter;

          public class MainActivity extends BridgeActivity {
              private LocalDropServer dropServer;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  dropServer = new LocalDropServer(this);
                  try {
                      dropServer.start();
                  } catch (Exception e) {
                      e.printStackTrace();
                  }

                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(this, new String[]{
                          Manifest.permission.CAMERA,
                          Manifest.permission.READ_EXTERNAL_STORAGE,
                          Manifest.permission.WRITE_EXTERNAL_STORAGE
                      }, 101);
                  }
              }

              @Override
              public void onStart() {
                  super.onStart();
                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      this.bridge.getWebView().getSettings().setUserAgentString(
                          this.bridge.getWebView().getSettings().getUserAgentString() + " DropPulseApp"
                      );
                      this.bridge.getWebView().addJavascriptInterface(new Object() {
                          @JavascriptInterface
                          public String getServerUrl() {
                              return dropServer.getLocalIpUrl();
                          }

                          @JavascriptInterface
                          public String getQrSvg(String text) {
                              try {
                                  BitMatrix m = new QRCodeWriter().encode(text, BarcodeFormat.QR_CODE, 220, 220);
                                  StringBuilder sb = new StringBuilder("<svg width='180' height='180' viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'><rect width='220' height='220' fill='#ffffff'/>");
                                  for (int y = 0; y < m.getHeight(); y++) {
                                      for (int x = 0; x < m.getWidth(); x++) {
                                          if (m.get(x, y)) sb.append("<rect x='").append(x).append("' y='").append(y).append("' width='1' height='1' fill='#000000'/>");
                                      }
                                  }
                                  return sb.append("</svg>").toString();
                              } catch (Exception e) {
                                  return "";
                              }
                          }
                      }, "AndroidServer");

                      this.bridge.getWebView().setWebChromeClient(new WebChromeClient() {
                          @Override
                          public void onPermissionRequest(final PermissionRequest request) {
                              runOnUiThread(() -> request.grant(request.getResources()));
                          }
                      });
                  }
              }
          }
          EOF

          # 5. Permissions
          sed -i 's/<application/<uses-permission android:name="android.permission.CAMERA" \/>\n    <uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" \/>\n    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" \/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" \/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" \/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" \/>\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" \/>\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" \/>\n    <application android:usesCleartextTraffic="true" android:requestLegacyExternalStorage="true"/' android/app/src/main/AndroidManifest.xml

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Official APK
        uses: actions/upload-artifact@v4
        with:
          name: DropPulse-PRO-Official
          path: android/app/build/outputs/apk/debug/app-debug.apk
